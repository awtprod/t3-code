# Installed as ~commandcenter/.config/containers/storage.conf (uid 986).
#
# graphroot points at the XFS loopback mount so that `podman volume create --opt
# o=size=N` can be enforced as an XFS project quota. On the host's ext4 root
# filesystem that option is accepted and echoed back but never enforced.
[storage]
driver = "overlay"
runroot = "/run/user/986/containers"
graphroot = "/var/lib/command-center/sandbox/storage"

[storage.options]
# Volumes created with `--opt o=size=` land here; it must be on the same XFS
# filesystem as graphroot for project quotas to apply.
pull_options = {enable_partial_images = "false", use_hard_links = "false"}

[storage.options.overlay]
# Kernel 6.8 supports unprivileged overlayfs in a user namespace, so the native
# overlay driver works without fuse-overlayfs. Leaving mount_program unset is
# deliberate: fuse-overlayfs is markedly slower and does not honour project
# quotas the same way.
mountopt = "nodev"
