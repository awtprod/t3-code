# Command Center per-thread container sandbox configuration.
#
# =====================================================================
#  READ THIS BEFORE UNCOMMENTING ANYTHING BELOW.
# =====================================================================
#
#  Setting BOTH T3_SANDBOX_IMAGE and T3_SANDBOX_PREVIEW_PROXY_IMAGE is a
#  ONE-WAY SWITCH for this host.
#
#  ProviderCommandReactor.ensureExecutionTarget falls back to running a
#  thread directly on the host ("legacy-host") only while at least one of
#  those two images is unset. The moment both are set, that fallback is
#  gone and EVERY NEW THREAD on this box must successfully provision a
#  container. A broken image reference, an unreachable registry, or a
#  podman socket that failed to start then means no thread can start work
#  at all.
#
#  Provisioning a container is necessary but NOT sufficient. A thread that
#  starts a container and has no credential proxy still cannot run its
#  provider. The minimum working set is five lines, not two:
#
#    T3_SANDBOX_RUNTIME=podman
#    T3_SANDBOX_IMAGE=...
#    T3_SANDBOX_PREVIEW_PROXY_IMAGE=...
#    T3_SANDBOX_CREDENTIAL_PROXY_IMAGE=...
#    T3_SANDBOX_EGRESS_PROXY_IMAGE=...
#
#  plus the credential file referenced at the bottom of this file.
#
#  Do not uncomment these on a hunch. Follow the canary procedure in
#  docs/operations/sandbox-host.md first, on a scratch instance, then flip
#  production deliberately.
#
#  Rollback is re-commenting the two image lines and restarting the
#  service; the legacy-host fallback returns immediately.
#
# =====================================================================

[Service]

# --- Required for the sandbox to work at all -------------------------
#
# ProtectSystem=strict makes /run read-only for this unit, so without this
# the server cannot connect to the rootless podman socket. This line is
# safe to enable on its own and does NOT switch sandboxing on: it only
# punches a hole for the socket. Enable it with the bootstrap, verify the
# service still starts, and leave it in place.
#
# ReadWritePaths=/run/user/986/podman

# --- Container runtime selection -------------------------------------
#
#  ##################################################################
#  #  THE SINGLE MOST IMPORTANT LINE IN THIS FILE.                  #
#  ##################################################################
#
#  Without T3_SANDBOX_RUNTIME=podman, the server defaults to `docker`
#  and NEVER invokes /opt/command-center/bin/podman. The entire
#  bootstrap -- the rootless socket, the XFS quota mount, the pinned
#  netavark -- sits unused.
#
#  It does not fail loudly. The backend resolves the bare name `docker`
#  through PATH, finds the rootful /usr/bin/docker, and its rootless
#  check rejects it; provisioning fails and threads fall back to the
#  host. You get the legacy behaviour and a confusing error, not a
#  sandbox.
#
#  Set this at the SAME TIME as the two image variables below. Setting
#  the images without this one is the worst of both worlds: mandatory
#  sandboxing pointed at a runtime that cannot satisfy it.
#
# Environment=T3_SANDBOX_RUNTIME=podman

# --- The one-way switch ----------------------------------------------
#
# Both images must be pinned by sha256 digest; the backend rejects tags.
# Build them with deploy/openclaw/sandbox-image/build-sandbox-images.sh and
# paste the resulting digests here.
#
# Environment=T3_SANDBOX_IMAGE=localhost/t3/sandbox-workspace-headless@sha256:<64-hex-digest>
# Environment=T3_SANDBOX_PREVIEW_PROXY_IMAGE=localhost/t3/sandbox-sidecar@sha256:<64-hex-digest>

# --- Provider credentials: required for a thread to do any work ------
#
#  A sandboxed thread has NO provider credentials of its own. The server
#  refuses to forward the host's copy: SandboxProviderProcess deletes any
#  persistent provider credential from the child environment and throws
#
#    direct forwarding of persistent provider credential <NAME> is denied;
#    use a thread-scoped credential proxy
#
#  That is deliberate fail-closed behaviour, NOT a bug to work around by
#  exporting ANTHROPIC_API_KEY into the service environment -- doing so
#  hits exactly the check above and makes things worse.
#
#  The supported path is the credential proxy sidecar: it holds the secret
#  and injects it per request, so the token never enters the container.
#
#  If T3_SANDBOX_CREDENTIAL_PROXY_IMAGE is unset, no sidecar starts, no
#  proxy binding is created, and every provider spawn fails with the error
#  above. Combined with the one-way switch that means NO THREAD CAN WORK.
#  Set this at the same time as the images.
#
#  The digest is the SAME sidecar image as the preview and egress proxies.
#  build-sandbox-images.sh produces exactly two images -- workspace and
#  sidecar -- and the server picks the role through the container argv.
#  All three *_PROXY_IMAGE lines therefore carry an identical digest.
#  There is no separate credential-proxy build output; do not go looking
#  for one. (The build script prints only the workspace, preview and
#  egress lines, so this value has to be copied across by hand.)
#
# Environment=T3_SANDBOX_CREDENTIAL_PROXY_IMAGE=localhost/t3/sandbox-sidecar@sha256:<64-hex-digest>

# The egress sidecar is REQUIRED once the credential proxy is on.
# ThreadCredentialProxySidecar.start refuses to start without it:
#
#   credential proxy requires the egress sidecar; set
#   T3_SANDBOX_EGRESS_PROXY_IMAGE or unset T3_SANDBOX_CREDENTIAL_PROXY_IMAGE
#
# Same digest as the two lines above. When set, the workspace container
# has no direct route out and reaches the network only through this proxy,
# resolved as `egress-proxy` on the thread's internal network.
#
# Environment=T3_SANDBOX_EGRESS_PROXY_IMAGE=localhost/t3/sandbox-sidecar@sha256:<64-hex-digest>

# The secret the credential proxy injects. It is NOT set here: this file
# is world-readable (0644) and tracked in git, which is the last place a
# long-lived token should land. It goes in a root-owned 0600 file that the
# operator writes by hand and the bootstrap script never touches.
#
# The leading `-` means the unit still starts when the file is absent, so
# enabling this line early is harmless.
#
# See docs/operations/sandbox-host.md section 5 for minting the token with
# `claude setup-token` and for rotation.
#
# EnvironmentFile=-/etc/command-center/sandbox-credentials.env

# --- Optional, safe to set before the switch -------------------------

# Where exported thread artifacts (Git bundles) are written on the host.
# Must be inside an existing ReadWritePaths entry; /var/lib/command-center/runtime
# already is.
#
# Environment=T3_SANDBOX_ARTIFACT_DIR=/var/lib/command-center/runtime/sandbox-artifacts

# Disable the in-sandbox desktop (X/WebRTC) stack. Recommended for the
# first production flip: it removes a large moving part from the critical
# path of starting a thread.
#
# Environment=T3_SANDBOX_DESKTOP=disabled

# Disable per-container AND per-volume (workspace/desktop) storage quotas.
# Set this ONLY if the XFS pquota mount is unavailable, or rootless podman
# cannot administer XFS project quotas on this host (it needs CAP_SYS_ADMIN
# in the namespace that owns the mounted filesystem's superblock, which a
# rootless user namespace never has -- confirmed structural, not a config
# issue, via `xfs_quota -x -c 'limit -p ...'` succeeding as real root while
# `podman volume create --opt o=size=...` fails identically regardless of
# mount state). Accept that a runaway thread can fill the shared sandbox
# filesystem; threads remain otherwise isolated (read-only root, internal
# network, dedicated volumes). With the mount healthy and podman able to
# administer it, leave this unset.
#
# Environment=T3_SANDBOX_CONTAINER_STORAGE_QUOTA=disabled

# Git identity used for commits made inside sandboxes. Without these, git
# operations in the container have no committer identity and fail.
#
# Environment=T3_SANDBOX_GIT_USER_NAME=Command Center
# Environment=T3_SANDBOX_GIT_USER_EMAIL=commandcenter@example.com
