# Installed into the uid 986 user manager as a drop-in for podman.socket.
#
# Fail closed if the XFS sandbox storage is not mounted.
#
# Without this, a boot where the mount unit failed leaves podman happily
# initialising its graphroot on the plain ext4 directory underneath the empty
# mount point. Everything then appears to work -- containers start, volumes are
# created, `volume create --opt o=size=N` is accepted and echoed back verbatim --
# but the XFS project quotas that option relies on do not exist, so nothing is
# enforced. A single runaway thread fills the root filesystem and takes the whole
# service down.
#
# That failure is silent and indistinguishable from success at every layer above,
# including the backend's own quota readback check. Refusing to start the socket
# turns it into an obvious, immediate error instead.

# Only [Unit] and [Socket] are valid in a .socket drop-in; a [Service] section
# here would be ignored (and ExecCondition= is not a socket-unit setting).
[Unit]
ConditionPathIsMountPoint=/var/lib/command-center/sandbox
