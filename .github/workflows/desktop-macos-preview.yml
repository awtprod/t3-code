name: Desktop macOS Preview

# Untrusted half of the macOS preview. This runs PR code (including fork PRs)
# with a read-only token and no secrets, and only produces the JS bundle. The
# trusted half, desktop-macos-preview-publish.yml, runs on workflow_run from
# main, verifies the PR author is vouched, then packages, signs, notarizes, and
# publishes the bundle without ever executing it.
#
# The label is a one-shot request for the commit it was applied to, not a
# standing subscription: the trusted half removes it once this run completes,
# and later pushes do not build until a maintainer applies it again. Each
# signed preview is therefore an explicit per-commit decision.
#
# Closing the PR is handled by the publish workflow too, since deleting the
# download needs a write token.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: desktop-macos-preview-${{ github.event.pull_request.number }}
  # Adding an unrelated label skips the job and must not cancel a build.
  cancel-in-progress: ${{ github.event.label.name == 'preview:mac' }}

jobs:
  build:
    name: Build preview JS bundle
    if: github.event.label.name == 'preview:mac'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      # This repository is public, so Git needs no credentials. checkout's
      # credential cleanup runs submodule foreach even with submodules disabled,
      # which fails on the orphaned gitlinks in our vendored .repos tree.
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.event.pull_request.head.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install bundle dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      # The publish workflow derives the same version from this run's number,
      # so the version baked into the bundle matches the packaged app.
      - name: Set preview version and public configuration
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          base_version="$(node -p "require('./apps/desktop/package.json').version")"
          node scripts/update-release-package-versions.ts "${base_version}-pr.${PR_NUMBER}.${GITHUB_RUN_NUMBER}"
          # Public T3 Connect identifiers (Clerk publishable key, relay URL).
          cp .env.example .env

      - uses: ./.github/actions/setup-apt-mirrors

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build JS bundle
        run: vp run build:desktop

      # Same layout as release.yml's js-bundle so release-desktop.yml can
      # package it unchanged.
      - name: Upload JS bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          archive: false
          overwrite: true
          retention-days: 7

  # Release assets download without a GitHub account, unlike workflow
  # artifacts. All preview DMGs live on one rolling prerelease tagged
  # "desktop-preview" (release.yml only matches v*.*.* tags), so publishing a
  # build never notifies release watchers. This job holds the write token and
  # only handles the artifact the build job produced; it never runs PR code.
  publish:
    name: Publish anonymous download
    needs: build
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Download macOS DMG
        uses: actions/download-artifact@v8
        with:
          pattern: "*.dmg"
          merge-multiple: true
          path: release

      - id: upload
        name: Upload DMG to the rolling preview release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          tag="desktop-preview"

          delete_asset_if_present() {
            local asset="$1"
            if gh release delete-asset "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --yes; then
              return
            fi
            local assets
            assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            if grep -Fxq -- "$asset" <<< "$assets"; then
              echo "Failed to delete preview asset $asset." >&2
              return 1
            fi
            echo "Asset $asset was already removed by a concurrent run."
          }

          preview_eligibility() {
            local snapshot
            if ! snapshot="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json state,labels \
              --jq '.state + " " + (.labels | map(.name) | contains(["preview:mac"]) | tostring)')"; then
              echo "Could not verify current PR preview eligibility." >&2
              return 1
            fi
            [[ "$snapshot" == "OPEN true" ]] && printf 'true\n' || printf 'false\n'
          }

          # The build ran for many minutes. If the PR closed or lost the label
          # meanwhile, cleanup already ran in its own concurrency group, so
          # publishing now would resurrect a deleted download.
          eligibility="$(preview_eligibility)"
          if [[ "$eligibility" != "true" ]]; then
            echo "PR closed or preview label removed while building. Skipping publish."
            exit 0
          fi

          dmg_path="$(find release -type f -name '*.dmg' -print -quit)"
          if [[ -z "$dmg_path" ]]; then
            echo "No DMG found in the downloaded artifact." >&2
            exit 1
          fi

          # The filename comes out of the build, which runs PR code. Requiring
          # this PR's marker keeps a build from clobbering or deleting another
          # PR's asset, since those names carry a different -pr.N. marker.
          if [[ "$(basename "$dmg_path")" != *"-pr.${PR_NUMBER}."* ]]; then
            echo "DMG name '$(basename "$dmg_path")' does not carry this PR's -pr.${PR_NUMBER}. marker. Refusing to publish." >&2
            exit 1
          fi

          repo_owner="${GITHUB_REPOSITORY%%/*}"
          repo_name="${GITHUB_REPOSITORY#*/}"
          release_id="$(gh api graphql \
            -f query='query($owner:String!,$name:String!,$tag:String!){repository(owner:$owner,name:$name){release(tagName:$tag){id}}}' \
            -F owner="$repo_owner" -F name="$repo_name" -F tag="$tag" \
            --jq '.data.repository.release.id // empty')"
          if [[ -z "$release_id" ]]; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$DEFAULT_BRANCH" \
              --prerelease \
              --title "Desktop preview builds" \
              --notes "Rolling unsigned desktop builds from pull requests with a preview label. Each download is removed when its pull request closes or loses the label. Install stable builds from the latest release instead." \
              || gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi

          # Upload the replacement before deleting older builds, so users do
          # not lose the only valid download if an upload fails.
          gh release upload "$tag" "$dmg_path" --repo "$GITHUB_REPOSITORY" --clobber

          # Keep one DMG per PR: drop this PR's older builds. The
          # trailing dot keeps -pr.12. from matching -pr.123. builds.
          uploaded_name="$(basename "$dmg_path")"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | { grep -F -- "-pr.${PR_NUMBER}." || true; } \
            | while read -r asset; do
                [[ "$asset" == "$uploaded_name" ]] && continue
                delete_asset_if_present "$asset"
              done

          # Re-check after uploading. A cleanup run that started during the
          # upload listed assets before ours existed, so it cannot delete it.
          # Whichever writer acts last sees the final PR state; if the preview
          # became ineligible, delete what we just uploaded.
          eligibility="$(preview_eligibility)"
          if [[ "$eligibility" != "true" ]]; then
            delete_asset_if_present "$uploaded_name"
            echo "PR closed or preview label removed during upload. Removed the download."
            exit 0
          fi

          echo "download_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${uploaded_name}" >> "$GITHUB_OUTPUT"

      - name: Comment download link
        if: steps.upload.outputs.download_url != ''
        uses: actions/github-script@v8
        env:
          DOWNLOAD_URL: ${{ steps.upload.outputs.download_url }}
          DMG_NAME: ${{ needs.build.outputs.dmg_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_VERSION: ${{ needs.build.outputs.version }}
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            if (
              pullRequest.head.sha !== process.env.HEAD_SHA ||
              pullRequest.state !== "open" ||
              !pullRequest.labels.some((label) => label.name === "preview:mac")
            ) {
              core.info("Skipping the outdated macOS preview comment.");
              return;
            }

            const marker = "<!-- desktop-macos-preview -->";
            const body = [
              marker,
              "### macOS preview",
              "",
              `[Download Apple Silicon DMG](${process.env.DOWNLOAD_URL})`,
              "",
              `Version: ${process.env.PREVIEW_VERSION}`,
              `Commit: ${process.env.HEAD_SHA.slice(0, 7)}`,
              "",
              "Unsigned build. Clear quarantine before opening:",
              "```sh",
              `xattr -d com.apple.quarantine ~/Downloads/${process.env.DMG_NAME}`,
              "```",
              "",
              "No GitHub sign-in is needed. The download stays available until this PR closes or the preview label is removed.",
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

  # The way out: closing the PR or removing the label deletes its DMG from the
  # rolling release and updates the PR comment to say so.
  cleanup:
    name: Remove preview download
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'preview:mac'))
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: delete
        name: Delete this PR's preview assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          tag="desktop-preview"

          delete_asset_if_present() {
            local asset="$1"
            if gh release delete-asset "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --yes; then
              return
            fi
            local assets
            assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            if grep -Fxq -- "$asset" <<< "$assets"; then
              echo "Failed to delete preview asset $asset." >&2
              return 1
            fi
            echo "Asset $asset was already removed by a concurrent run."
          }

          # A stale cleanup must not delete a download that became valid
          # again. If the PR is open and labeled once more, the next publish
          # owns this PR's assets and replaces them itself.
          preview_eligibility() {
            local snapshot
            if ! snapshot="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json state,labels \
              --jq '.state + " " + (.labels | map(.name) | contains(["preview:mac"]) | tostring)')"; then
              echo "Could not verify current PR preview eligibility." >&2
              return 1
            fi
            [[ "$snapshot" == "OPEN true" ]] && printf 'true\n' || printf 'false\n'
          }

          eligibility="$(preview_eligibility)"
          if [[ "$eligibility" == "true" ]]; then
            echo "PR is open and labeled again. Skipping cleanup."
            echo "removed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "removed=true" >> "$GITHUB_OUTPUT"

          repo_owner="${GITHUB_REPOSITORY%%/*}"
          repo_name="${GITHUB_REPOSITORY#*/}"
          release_id="$(gh api graphql \
            -f query='query($owner:String!,$name:String!,$tag:String!){repository(owner:$owner,name:$name){release(tagName:$tag){id}}}' \
            -F owner="$repo_owner" -F name="$repo_name" -F tag="$tag" \
            --jq '.data.repository.release.id // empty')"
          if [[ -z "$release_id" ]]; then
            echo "No preview release exists. Nothing to clean up."
            exit 0
          fi

          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | { grep -F -- "-pr.${PR_NUMBER}." || true; } \
            | while read -r asset; do
                delete_asset_if_present "$asset"
              done

      - name: Mark the preview comment as removed
        if: steps.delete.outputs.removed == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const marker = "<!-- desktop-macos-preview -->";
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (!existing) {
              return;
            }

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: [
                marker,
                "### macOS preview",
                "",
                "The preview download was removed because this PR closed or the preview label was removed.",
              ].join("\n"),
            });
