name: Desktop Windows Build

# On-demand full desktop build for Windows. Produces the standard (non-remote-only)
# Command Center NSIS installer: a bundled local backend plus the "Desktop
# execution" / primary-backend controls. Unsigned; intended for installing on
# your own PCs. Installs per-user over an existing Command Center install.
#
# Runs on GitHub-hosted Windows runners so it does not depend on the Blacksmith
# pool that release.yml uses. Artifacts stay attached to the workflow run; no
# release or tag is created.
#
# Unlike release.yml this does not bundle the Linux node-pty prebuild, so the
# packaged WSL backend is not usable; the native Windows backend is unaffected.
#
# Also runs on pull requests that change this file, which both self-tests the
# workflow and registers it with GitHub so it can be dispatched before merge.

on:
  pull_request:
    paths:
      - .github/workflows/desktop-windows-build.yml
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the app (defaults to apps/server/package.json)"
        required: false
        type: string
      verify_artifact_run_id:
        description: "Verify an existing successful installer run on Windows instead of building"
        required: false
        type: string
      diagnose_windows_startup:
        description: "Compare existing pairing.2 and pairing.3 Windows startup with native diagnostics"
        required: false
        default: false
        type: boolean
      verification_runner:
        description: "Windows image for existing-artifact verification or startup diagnostics"
        required: false
        default: windows-2025
        type: choice
        options:
          - windows-2025
          - windows-2022

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !inputs.verify_artifact_run_id && !inputs.diagnose_windows_startup }}
    name: Build Windows x64
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # node-pty's Windows build requests Spectre-mitigated MSVC libraries, which
      # the hosted Visual Studio image does not install by default.
      - name: Install Spectre-mitigated MSVC libs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - id: version
        name: Align package versions
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION_INPUT#v}"
          if [[ -z "$version" ]]; then
            version="$(node -p "require('./apps/server/package.json').version")"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          node scripts/update-release-package-versions.ts "$version"
          # Public T3 Connect identifiers, same as official builds. Not secrets.
          cp .env.example .env
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: build
        name: Build unsigned Windows installer
        shell: bash
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          vp run dist:desktop:artifact \
            --platform win \
            --target nsis \
            --arch x64 \
            --build-version "$BUILD_VERSION" \
            --verbose

          shopt -s nullglob
          exe_files=(release/*.exe)
          if (( ${#exe_files[@]} != 1 )); then
            printf 'Expected one installer, found %s.\n' "${#exe_files[@]}" >&2
            exit 1
          fi
          exe_name="$(basename "${exe_files[0]}")"
          if [[ "$exe_name" == Command-Center-Remote-* ]]; then
            echo "Built the remote-only variant by mistake: $exe_name" >&2
            exit 1
          fi
          echo "exe_name=$exe_name" >> "$GITHUB_OUTPUT"
          sha256sum release/*.exe | tee release/SHA256SUMS.txt

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: command-center-windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        shell: bash
        env:
          EXE_NAME: ${{ steps.build.outputs.exe_name }}
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### Windows x64 build"
            echo
            echo "- Artifact: \`command-center-windows-x64\`"
            echo "- File: \`$EXE_NAME\`"
            echo "- Version: \`$BUILD_VERSION\`"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo
            echo "Unsigned build: SmartScreen will warn on first run (More info → Run anyway)."
          } >> "$GITHUB_STEP_SUMMARY"

  verify-packaged-pairing:
    if: ${{ inputs.verify_artifact_run_id && !inputs.diagnose_windows_startup }}
    name: Verify packaged Windows pairing
    runs-on: ${{ inputs.verification_runner || 'windows-2025' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Download and verify exact installer provenance
        id: payload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.verify_artifact_run_id }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:ARTIFACT_RUN_ID -notmatch '^\d+$') { throw "Invalid artifact run ID" }
          if ($env:EXPECTED_VERSION -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') { throw "Expected version required" }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:ARTIFACT_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Cannot read artifact provenance" }
          if ($run.conclusion -ne "success" -or $run.path -ne ".github/workflows/desktop-windows-build.yml" -or $run.head_branch -ne "fix/desktop-saved-environment-recovery") { throw "Unexpected artifact provenance" }
          if ($run.head_sha -notmatch '^[a-f0-9]{40}$') { throw "Invalid source commit" }
          New-Item -ItemType Directory -Force windows-pairing-artifact, windows-pairing-evidence | Out-Null
          gh run download $env:ARTIFACT_RUN_ID --repo $env:GITHUB_REPOSITORY --name command-center-windows-x64 --dir windows-pairing-artifact
          if ($LASTEXITCODE -ne 0) { throw "Artifact download failed" }
          $installer = @(Get-ChildItem windows-pairing-artifact -Filter *.exe)
          if ($installer.Count -ne 1) { throw "Expected exactly one installer" }
          $declared = (Get-Content windows-pairing-artifact/SHA256SUMS.txt).Split(' ')[0]
          $actual = (Get-FileHash $installer[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $declared) { throw "Installer checksum mismatch" }
          git fetch --depth=1 origin $run.head_sha
          if ($LASTEXITCODE -ne 0) { throw "Cannot fetch exact artifact source" }
          git show "$($run.head_sha):packages/client-runtime/src/connection/registry.ts" | Set-Content -Encoding utf8 expected-registry.ts
          if ($LASTEXITCODE -ne 0) { throw "Cannot export exact registry source" }
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip/7z.exe"
          & $sevenZip x $installer[0].FullName "-owindows-pairing-extracted" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Installer extraction failed" }
          $nested = @(Get-ChildItem windows-pairing-extracted -Recurse -Filter app-64.7z)
          if ($nested.Count -ne 1) { throw "Expected exactly one x64 application payload" }
          & $sevenZip x $nested[0].FullName "-owindows-pairing-app" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Payload extraction failed" }
          $app = @(Get-ChildItem windows-pairing-app -Filter *.exe | Where-Object Name -NotMatch 'uninstall')
          if ($app.Count -ne 1) { throw "Expected exactly one packaged application" }
          $metadata = @{ artifactRunId = $run.id; artifactRunUrl = $run.html_url; artifactCommit = $run.head_sha; version = $env:EXPECTED_VERSION; installerSha256 = $actual; verificationCommit = $env:GITHUB_SHA; productionAccess = $false }
          $metadata | ConvertTo-Json | Set-Content windows-pairing-evidence/provenance.json
          "executable=$($app[0].FullName)" >> $env:GITHUB_OUTPUT
          "commit=$($run.head_sha)" >> $env:GITHUB_OUTPUT

      - name: Block packaged application external traffic
        shell: pwsh
        env:
          APP_EXECUTABLE: ${{ steps.payload.outputs.executable }}
        run: |
          # Disposable CI host only. Windows loopback traffic bypasses this rule;
          # all non-loopback traffic from the packaged Electron process is blocked.
          New-NetFirewallRule -DisplayName "CC synthetic pairing smoke" -Direction Outbound -Action Block -Program $env:APP_EXECUTABLE -Profile Any -RemoteAddress Any -ErrorAction Stop | Out-Null

      - name: Exercise packaged Electron and Windows secure storage
        shell: pwsh
        env:
          APP_EXECUTABLE: ${{ steps.payload.outputs.executable }}
          ARTIFACT_COMMIT: ${{ steps.payload.outputs.commit }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          node apps/desktop/scripts/pairing-smoke/run.mjs $env:APP_EXECUTABLE windows-pairing-evidence $env:ARTIFACT_COMMIT $env:EXPECTED_VERSION expected-registry.ts
          if ($LASTEXITCODE -ne 0) { throw "Packaged Windows pairing verification failed" }

      - name: Capture tested application crash metadata
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          APP_EXECUTABLE: ${{ steps.payload.outputs.executable }}
        run: |
          if (!$env:APP_EXECUTABLE) { exit 0 }
          $name = Split-Path -Leaf $env:APP_EXECUTABLE
          $records = @(Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000; StartTime=(Get-Date).AddMinutes(-10)} -ErrorAction SilentlyContinue | ForEach-Object {
            $xml = [xml]$_.ToXml()
            $fields = @{}
            foreach ($item in $xml.Event.EventData.Data) { $fields[$item.Name] = $item.'#text' }
            if ($fields.AppName -eq $name) {
              @{ createdAt=$_.TimeCreated.ToUniversalTime().ToString('o'); application=$fields.AppName; module=$fields.ModuleName; exceptionCode=$fields.ExceptionCode; processId=$fields.ProcessId; moduleOffset=$fields.FaultingOffset }
            }
          })
          ConvertTo-Json -InputObject $records | Set-Content windows-pairing-evidence/windows-crash-metadata.json

      - name: Upload redacted Windows verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-pairing-verification
          path: |
            windows-pairing-evidence/*.json
            windows-pairing-evidence/*.png
          if-no-files-found: warn
          retention-days: 14

  diagnose-windows-startup:
    if: ${{ inputs.diagnose_windows_startup }}
    name: Compare shipped Windows startup
    runs-on: ${{ inputs.verification_runner || 'windows-2025' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Verify and extract shipped baseline and repaired installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force windows-startup-diagnosis | Out-Null
          $expected = @(
            @{ id=37999068380; version='0.0.29-pairing.2'; commit='a9ae6268c7375d94fb4ca7aab648f1532f4634ca' },
            @{ id=38004694929; version='0.0.29-pairing.3'; commit='f27ff1901dc220b564b849013e07cc0952aa87b8' }
          )
          $artifacts = @()
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          foreach ($item in $expected) {
            $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($item.id)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $run.conclusion -ne 'success' -or $run.head_sha -ne $item.commit -or $run.path -ne '.github/workflows/desktop-windows-build.yml') { throw 'Unexpected source provenance' }
            $directory = "windows-startup-payload-$($item.id)"
            gh run download $item.id --repo $env:GITHUB_REPOSITORY --name command-center-windows-x64 --dir "$directory/installer"
            if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
            $installer = @(Get-ChildItem "$directory/installer" -Filter *.exe)
            if ($installer.Count -ne 1) { throw 'Expected one installer' }
            $declared = (Get-Content "$directory/installer/SHA256SUMS.txt").Split(' ')[0]
            $actual = (Get-FileHash $installer[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $declared) { throw 'Installer checksum mismatch' }
            & $sevenZip x $installer[0].FullName "-o$directory/nsis" -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'NSIS extraction failed' }
            $nested = @(Get-ChildItem "$directory/nsis" -Recurse -Filter app-64.7z)
            if ($nested.Count -ne 1) { throw 'Expected one x64 payload' }
            & $sevenZip x $nested[0].FullName "-o$directory/app" -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Full application extraction failed' }
            $app = @(Get-ChildItem "$directory/app" -Filter *.exe | Where-Object Name -NotMatch 'uninstall')
            if ($app.Count -ne 1) { throw 'Expected one application' }
            New-NetFirewallRule -DisplayName "CC diagnostic $($item.id)" -Direction Outbound -Action Block -Program $app[0].FullName -Profile Any -RemoteAddress Any -ErrorAction Stop | Out-Null
            $artifacts += @{ runId=$item.id; version=$item.version; commit=$item.commit; executable=$app[0].FullName; installerSha256=$actual; nestedPayloadSha256=(Get-FileHash $nested[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          ConvertTo-Json -InputObject $artifacts -Depth 5 | Set-Content windows-startup-diagnosis/artifacts.json

      - name: Verify upstream Electron runtime control
        id: control
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'electron-v43.4.1-win32-x64.zip'
          gh release download v43.4.1 --repo electron/electron --pattern $name --pattern SHASUMS256.txt --dir windows-electron-control
          if ($LASTEXITCODE -ne 0) { throw 'Official Electron download failed' }
          $rows = @(Get-Content windows-electron-control/SHASUMS256.txt | Where-Object { $_ -match "\s+\*?$([Regex]::Escape($name))$" })
          if ($rows.Count -ne 1) { throw 'Official Electron checksum row missing' }
          $declared = ($rows[0] -split '\s+')[0]
          $actual = (Get-FileHash "windows-electron-control/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          $pinned = 'c2ef9a5f65472c34d14bd3e67b7d14e66b0c01f124aba45263d6a4232160e13a'
          if ($actual -ne $declared -or $actual -ne $pinned) { throw 'Official Electron checksum mismatch' }
          Expand-Archive "windows-electron-control/$name" windows-electron-control/runtime
          $exe = (Resolve-Path windows-electron-control/runtime/electron.exe).Path
          New-NetFirewallRule -DisplayName 'CC upstream runtime control' -Direction Outbound -Action Block -Program $exe -Profile Any -RemoteAddress Any -ErrorAction Stop | Out-Null
          @{version='43.4.1'; zipSha256=$actual; executableSha256=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant(); source='https://github.com/electron/electron/releases/tag/v43.4.1'} | ConvertTo-Json | Set-Content windows-startup-diagnosis/upstream-runtime-provenance.json
          "executable=$exe" >> $env:GITHUB_OUTPUT

      - name: Prepare Microsoft native debugger
        id: debugger
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/Debuggers/x64/cdb.exe'
          if (!(Test-Path $kits)) {
            # Official supported Windows SDK; install only debugging tools on this disposable runner.
            $setup = Join-Path $env:RUNNER_TEMP 'cc-winsdk-debugger-setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2382321' -OutFile $setup
            $signature = Get-AuthenticodeSignature $setup
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'SDK installer signature not trusted' }
            $process = Start-Process -FilePath $setup -ArgumentList '/features OptionId.WindowsDesktopDebuggers /quiet /norestart /ceip off' -PassThru
            if (!$process.WaitForExit(300000)) { Stop-Process -Id $process.Id; throw 'Debugger installation timed out' }
            if ($process.ExitCode -notin @(0,3010)) { throw "Debugger installation failed: $($process.ExitCode)" }
          }
          if (!(Test-Path $kits)) { throw 'Microsoft CDB unavailable after installation' }
          "path=$kits" >> $env:GITHUB_OUTPUT

      - name: Compare ordinary launch, isolated environments and native exception stacks
        shell: pwsh
        env:
          CDB_PATH: ${{ steps.debugger.outputs.path }}
          CONTROL_EXECUTABLE: ${{ steps.control.outputs.executable }}
          UPSTREAM_PREPARATION_OUTCOME: ${{ steps.control.outcome }}
          DEBUGGER_PREPARATION_OUTCOME: ${{ steps.debugger.outcome }}
        run: |
          node apps/desktop/scripts/pairing-smoke/diagnose-startup.mjs windows-startup-diagnosis/artifacts.json windows-startup-diagnosis $env:CDB_PATH $env:CONTROL_EXECUTABLE
          if ($LASTEXITCODE -ne 0) { throw 'Windows startup comparison failed to complete' }

      - name: Upload safe native startup evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-startup-diagnosis
          path: |
            windows-startup-diagnosis/*.json
            windows-startup-diagnosis/*.png
          if-no-files-found: warn
          retention-days: 14
