name: Desktop Windows Build

# On-demand full desktop build for Windows. Produces the standard (non-remote-only)
# Command Center NSIS installer: a bundled local backend plus the "Desktop
# execution" / primary-backend controls. Unsigned; intended for installing on
# your own PCs. Installs per-user over an existing Command Center install.
#
# Runs on GitHub-hosted Windows runners so it does not depend on the Blacksmith
# pool that release.yml uses. Artifacts stay attached to the workflow run; no
# release or tag is created.
#
# Unlike release.yml this does not bundle the Linux node-pty prebuild, so the
# packaged WSL backend is not usable; the native Windows backend is unaffected.
#
# Also runs on pull requests that change this file, which both self-tests the
# workflow and registers it with GitHub so it can be dispatched before merge.

on:
  pull_request:
    paths:
      - .github/workflows/desktop-windows-build.yml
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the app (defaults to apps/server/package.json)"
        required: false
        type: string
      verify_artifact_run_id:
        description: "Verify an existing successful installer run on Windows instead of building"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !inputs.verify_artifact_run_id }}
    name: Build Windows x64
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # node-pty's Windows build requests Spectre-mitigated MSVC libraries, which
      # the hosted Visual Studio image does not install by default.
      - name: Install Spectre-mitigated MSVC libs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - id: version
        name: Align package versions
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION_INPUT#v}"
          if [[ -z "$version" ]]; then
            version="$(node -p "require('./apps/server/package.json').version")"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          node scripts/update-release-package-versions.ts "$version"
          # Public T3 Connect identifiers, same as official builds. Not secrets.
          cp .env.example .env
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: build
        name: Build unsigned Windows installer
        shell: bash
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          vp run dist:desktop:artifact \
            --platform win \
            --target nsis \
            --arch x64 \
            --build-version "$BUILD_VERSION" \
            --verbose

          shopt -s nullglob
          exe_files=(release/*.exe)
          if (( ${#exe_files[@]} != 1 )); then
            printf 'Expected one installer, found %s.\n' "${#exe_files[@]}" >&2
            exit 1
          fi
          exe_name="$(basename "${exe_files[0]}")"
          if [[ "$exe_name" == Command-Center-Remote-* ]]; then
            echo "Built the remote-only variant by mistake: $exe_name" >&2
            exit 1
          fi
          echo "exe_name=$exe_name" >> "$GITHUB_OUTPUT"
          sha256sum release/*.exe | tee release/SHA256SUMS.txt

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: command-center-windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        shell: bash
        env:
          EXE_NAME: ${{ steps.build.outputs.exe_name }}
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### Windows x64 build"
            echo
            echo "- Artifact: \`command-center-windows-x64\`"
            echo "- File: \`$EXE_NAME\`"
            echo "- Version: \`$BUILD_VERSION\`"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo
            echo "Unsigned build: SmartScreen will warn on first run (More info → Run anyway)."
          } >> "$GITHUB_STEP_SUMMARY"

  verify-packaged-pairing:
    if: ${{ inputs.verify_artifact_run_id }}
    name: Verify packaged Windows pairing
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Download and verify exact installer provenance
        id: payload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.verify_artifact_run_id }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:ARTIFACT_RUN_ID -notmatch '^\d+$') { throw "Invalid artifact run ID" }
          if ($env:EXPECTED_VERSION -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') { throw "Expected version required" }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:ARTIFACT_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Cannot read artifact provenance" }
          if ($run.conclusion -ne "success" -or $run.path -ne ".github/workflows/desktop-windows-build.yml" -or $run.head_branch -ne "fix/desktop-saved-environment-recovery") { throw "Unexpected artifact provenance" }
          if ($run.head_sha -notmatch '^[a-f0-9]{40}$') { throw "Invalid source commit" }
          New-Item -ItemType Directory -Force windows-pairing-artifact, windows-pairing-evidence | Out-Null
          gh run download $env:ARTIFACT_RUN_ID --repo $env:GITHUB_REPOSITORY --name command-center-windows-x64 --dir windows-pairing-artifact
          if ($LASTEXITCODE -ne 0) { throw "Artifact download failed" }
          $installer = @(Get-ChildItem windows-pairing-artifact -Filter *.exe)
          if ($installer.Count -ne 1) { throw "Expected exactly one installer" }
          $declared = (Get-Content windows-pairing-artifact/SHA256SUMS.txt).Split(' ')[0]
          $actual = (Get-FileHash $installer[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $declared) { throw "Installer checksum mismatch" }
          git fetch --depth=1 origin $run.head_sha
          if ($LASTEXITCODE -ne 0) { throw "Cannot fetch exact artifact source" }
          git show "$($run.head_sha):packages/client-runtime/src/connection/registry.ts" | Set-Content -Encoding utf8 expected-registry.ts
          if ($LASTEXITCODE -ne 0) { throw "Cannot export exact registry source" }
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip/7z.exe"
          & $sevenZip x $installer[0].FullName "-owindows-pairing-extracted" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Installer extraction failed" }
          $nested = @(Get-ChildItem windows-pairing-extracted -Recurse -Filter app-64.7z)
          if ($nested.Count -ne 1) { throw "Expected exactly one x64 application payload" }
          & $sevenZip x $nested[0].FullName "-owindows-pairing-app" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Payload extraction failed" }
          $app = @(Get-ChildItem windows-pairing-app -Filter *.exe | Where-Object Name -NotMatch 'uninstall')
          if ($app.Count -ne 1) { throw "Expected exactly one packaged application" }
          $metadata = @{ artifactRunId = $run.id; artifactRunUrl = $run.html_url; artifactCommit = $run.head_sha; version = $env:EXPECTED_VERSION; installerSha256 = $actual; verificationCommit = $env:GITHUB_SHA; productionAccess = $false }
          $metadata | ConvertTo-Json | Set-Content windows-pairing-evidence/provenance.json
          "executable=$($app[0].FullName)" >> $env:GITHUB_OUTPUT
          "commit=$($run.head_sha)" >> $env:GITHUB_OUTPUT

      - name: Block packaged application external traffic
        shell: pwsh
        env:
          APP_EXECUTABLE: ${{ steps.payload.outputs.executable }}
        run: |
          # Disposable CI host only. Windows loopback traffic bypasses this rule;
          # all non-loopback traffic from the packaged Electron process is blocked.
          New-NetFirewallRule -DisplayName "CC synthetic pairing smoke" -Direction Outbound -Action Block -Program $env:APP_EXECUTABLE -Profile Any -RemoteAddress Any -ErrorAction Stop | Out-Null

      - name: Exercise packaged Electron and Windows secure storage
        shell: pwsh
        env:
          APP_EXECUTABLE: ${{ steps.payload.outputs.executable }}
          ARTIFACT_COMMIT: ${{ steps.payload.outputs.commit }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          node apps/desktop/scripts/pairing-smoke/run.mjs $env:APP_EXECUTABLE windows-pairing-evidence $env:ARTIFACT_COMMIT $env:EXPECTED_VERSION expected-registry.ts
          if ($LASTEXITCODE -ne 0) { throw "Packaged Windows pairing verification failed" }

      - name: Upload redacted Windows verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-pairing-verification
          path: |
            windows-pairing-evidence/*.json
            windows-pairing-evidence/*.png
          if-no-files-found: warn
          retention-days: 14
